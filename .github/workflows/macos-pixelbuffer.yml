name: macOS pixelbuffer

# Build and test matrix for macOS (Intel + Apple Silicon).
#
# Goals:
#   1) provide a cargo-check fast lane so iteration does not wait for a full
#      vcpkg ffmpeg build
#   2) prove hwcodec builds on both macOS architectures against rustdesk's
#      ffmpeg overlay port before any new API is added
#   3) guard the cfg: reject an invalid cfg(target_os = "darwin") in sources
#
# Triggers:
#   - push to feat/macos-pixelbuffer (x86_64 only by default, to save time)
#   - workflow_dispatch: choose archs and mode
#
# Note: a job-level `if:` cannot use matrix.* (the matrix is not expanded yet
# when the job-level if is evaluated), so arch filtering lives in the matrix
# definition and the runner is chosen with a runs-on expression.

on:
  workflow_dispatch:
    inputs:
      archs:
        description: 'JSON array of Rust targets, e.g. ["x86_64-apple-darwin"] or both'
        type: string
        default: '["x86_64-apple-darwin"]'
      mode:
        description: 'fast = cargo check --lib, full = cargo build + test --lib'
        type: choice
        options: [fast, full]
        default: fast
      submodules:
        description: 'checkout submodules (recursive) - not needed on macOS'
        type: boolean
        default: false
  push:
    branches: [feat/macos-pixelbuffer]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 120deac3062162151622ca4860575a33844ba10b
  VCPKG_ROOT: ${{ github.workspace }}/target/ci-vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/target/vcpkg-cache,readwrite
  CARGO_TERM_COLOR: always
  # hwcodec's build script uses bindgen 0.59, whose mux_ffi.rs contains the
  # classic offsetof pattern
  #   &(*(::std::ptr::null::<_opaque_pthread_t>())).__cleanup_stack
  # which newer rustc rejects via the deny-by-default `deref_nullptr` lint.
  # Two ways out:
  #   (a) pin Rust 1.81 like rustdesk's own macOS CI (flutter-build.yml
  #       MAC_RUST_VERSION) - but this repo has no Cargo.lock, so Cargo 1.81
  #       fails to resolve deps that require edition2024 (e.g. home 0.5.12)
  #   (b) stay on stable and allow that one lint (verified locally with
  #       rustc 1.99.1)
  # This workflow takes (b).
  MAC_RUST_TOOLCHAIN: "stable"
  RUSTFLAGS: "-A deref_nullptr"

jobs:
  macos:
    name: ${{ matrix.target }} / ${{ github.event.inputs.mode || 'fast' }}
    strategy:
      fail-fast: false
      matrix:
        # push events carry no inputs, so default to x86_64 only
        target: ${{ fromJSON(github.event.inputs.archs || '["x86_64-apple-darwin"]') }}
    runs-on: ${{ matrix.target == 'aarch64-apple-darwin' && 'macos-14' || 'macos-15-intel' }}
    timeout-minutes: 120

    steps:
      - name: Checkout hwcodec
        uses: actions/checkout@v4
        with:
          submodules: ${{ github.event.inputs.submodules == 'true' && 'recursive' || 'false' }}
          persist-credentials: false

      - name: Resolve triplet
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            echo "TRIPLET=arm64-osx" >> "$GITHUB_ENV"
          else
            echo "TRIPLET=x64-osx" >> "$GITHUB_ENV"
          fi

      # cfg guard 1/2: the target must really be macos
      - name: Assert target_os is macos
        run: |
          set -euo pipefail
          rustup toolchain install "$MAC_RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup target add --toolchain "$MAC_RUST_TOOLCHAIN" ${{ matrix.target }}
          rustc +$MAC_RUST_TOOLCHAIN --print cfg --target ${{ matrix.target }} | grep -qx 'target_os="macos"' \
            || { echo "FAIL: target_os is not macos for ${{ matrix.target }}"; exit 1; }
          echo "OK: target_os=macos"

      # cfg guard 2/2: no source file may use cfg(target_os = "darwin").
      # `rustc --print cfg` only proves the target; it cannot prove our own
      # sources are correct. Distinguish "no match" (ok) from "scan failed".
      - name: Scan sources for invalid cfg (darwin)
        run: |
          set -uo pipefail
          status=0
          grep -rnE 'target_os[[:space:]]*=[[:space:]]*"darwin"' src cpp || status=$?
          case "$status" in
            0) echo 'FAIL: invalid cfg target_os="darwin" found (Rust uses "macos")'; exit 1 ;;
            1) echo 'OK: no invalid darwin cfg' ;;
            *) echo "FAIL: cfg scan execution error (status=$status)"; exit "$status" ;;
          esac

      - name: Resolve libclang path (bindgen)
        run: |
          set -euo pipefail
          DEV=$(xcode-select -p)
          echo "LIBCLANG_PATH=$DEV/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
          ls "$DEV/Toolchains/XcodeDefault.xctoolchain/usr/lib/libclang.dylib" >/dev/null
          echo "OK: libclang found"

      - name: Checkout vcpkg (pinned)
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: target/ci-vcpkg
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout rustdesk ffmpeg overlay port
        id: rustdesk-ports
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          path: target/ci-rustdesk
          sparse-checkout: |
            res/vcpkg/ffmpeg
            res/vcpkg/mfx-dispatch
          persist-credentials: false

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: target/vcpkg-cache
          key: macos-pb-${{ matrix.target }}-${{ env.VCPKG_COMMIT }}-${{ steps.rustdesk-ports.outputs.commit }}

      - name: Install nasm (required by ffmpeg assembler on x86_64)
        run: |
          set -euo pipefail
          if ! command -v nasm >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install nasm
          fi
          nasm -v

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          mkdir -p target/vcpkg-cache
          ./target/ci-vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install ffmpeg (rustdesk overlay, videotoolbox)
        run: |
          set -euo pipefail
          ./target/ci-vcpkg/vcpkg install \
            --triplet "$TRIPLET" \
            --x-manifest-root=.github/vcpkg-macos \
            --x-install-root="$VCPKG_ROOT/installed" \
            --overlay-ports="${GITHUB_WORKSPACE}/target/ci-rustdesk/res/vcpkg"

      # The library only: examples/ and tests under dev/ are Windows-only
      # (pipeline_vram imports capture/render and hwcodec::vram), so a plain
      # --all-targets check cannot pass on macOS.
      - name: cargo check (fast lane)
        if: ${{ (github.event.inputs.mode || 'fast') == 'fast' }}
        run: |
          set -euo pipefail
          cargo +$MAC_RUST_TOOLCHAIN check --target ${{ matrix.target }} --lib 2>&1 | tail -40

      - name: cargo build (full)
        if: ${{ github.event.inputs.mode == 'full' }}
        run: |
          set -euo pipefail
          cargo +$MAC_RUST_TOOLCHAIN build --target ${{ matrix.target }} --lib 2>&1 | tail -40

      # Only the tests we own. The lib test binary also contains bindgen 0.59's
      # generated bindgen_test_layout_* tests, which panic with "null reference
      # produced" (a non-unwinding panic -> SIGABRT) on this target/toolchain.
      # That is pre-existing and unrelated; filter to the pixelbuffer module.
      - name: cargo test (owned tests only)
        if: ${{ github.event.inputs.mode == 'full' }}
        run: |
          set -euo pipefail
          cargo +$MAC_RUST_TOOLCHAIN test --target ${{ matrix.target }} --lib -- \
            ffmpeg_ram::pixelbuffer --nocapture 2>&1 | tail -40

      - name: Record environment
        if: always()
        run: |
          {
            echo "target: ${{ matrix.target }}"
            echo "triplet: $TRIPLET"
            echo "runner arch: $(uname -m)"
            echo "hwcodec base: $(git rev-parse HEAD)"
            echo "vcpkg: $VCPKG_COMMIT"
            echo "ffmpeg overlay: ${{ steps.rustdesk-ports.outputs.commit }}"
            rustc +$MAC_RUST_TOOLCHAIN -V
            cargo +$MAC_RUST_TOOLCHAIN -V
          } | tee env.txt
